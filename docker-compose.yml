version: '3'

services:

  aryl_bromide_backend:
    image: 'descriptor-backend:latest'
    environment:
      POSTGRES_SERVER: descriptor_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWD: "${POSTGRES_PASSWD:?is not set, expected from ../.env.secrets via the .env link in this folder}"
      POSTGRES_DB: aryl_bromide_data
      API_PREFIX: aryl_bromide
    entrypoint: bash prestart.sh
    networks:
      - external_network
      - descriptor-libraries-internal
    labels:
      - traefik.enable=true
      - traefik.http.services.descriptor_libraries-aryl_bromide_backend.loadbalancer.server.port=8080
      - "traefik.http.routers.descriptor_libraries-aryl_bromide_backend.rule=(Host(`descriptor-libraries.molssi.org`) && PathPrefix(`/api/aryl_bromide`))"
      - traefik.http.routers.descriptor_libraries-aryl_bromide_backend.entrypoints=websecure
      - traefik.http.routers.descriptor_libraries-aryl_bromide_backend.tls.certresolver=letsencrypt

  aryl_bromide_frontend:
    image: 'descriptor-frontend-alpine:latest'
    volumes:
      - "./public:/app/public"
    environment:
      - VITE_BASE_URL=/aryl_bromide
    networks:
      - external_network
    entrypoint: ash renameBase.sh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.descriptor_libraries-frontend-aryl_bromide.rule=(Host(`descriptor-libraries.molssi.org`) && PathPrefix(`/aryl_bromide`))"
      - "traefik.http.services.descriptor_libraries-frontend-aryl_bromide.loadbalancer.server.port=3000"
      - traefik.http.routers.descriptor_libraries-frontend-aryl_bromide.entrypoints=websecure
      - traefik.http.routers.descriptor_libraries-frontend-aryl_bromide.tls.certresolver=letsencrypt

networks:
  external_network:
    name: docker_main_net
    external: true
  descriptor-libraries-internal:
    external: true
